name: Ragaflow
options:
  bundleIdPrefix: com.ragaflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    INFOPLIST_FILE: Ragaflow/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"

configs:
  Debug: debug
  Release: release

targets:
  Ragaflow:
    type: application
    platform: iOS
    sources:
      - path: Ragaflow
        excludes:
          - "Configuration/*.xcconfig"
          - "Configuration/*.example"
          - "Resources/Package.swift.reference"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ragaflow.app
        GENERATE_INFOPLIST_FILE: false
        UIUserInterfaceStyle: Dark
      configs:
        Debug:
          xcconfig: Ragaflow/Configuration/Debug.xcconfig
        Release:
          xcconfig: Ragaflow/Configuration/Release.xcconfig
    entitlements:
      path: Ragaflow/Ragaflow.entitlements
      properties:
        com.apple.security.application-groups: []
    dependencies:
      - package: supabase-swift
        product: Supabase
    postCompileScripts: []

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
